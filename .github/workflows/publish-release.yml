name: Publish Release

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate next version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            let version;
            if (releases.length === 0) {
              version = '0.1.0';
            } else {
              const tag = releases[0].tag_name.replace(/^v/, '');
              const [major, minor, patch] = tag.split('.').map(Number);
              version = `${major}.${minor}.${patch + 1}`;
            }

            core.setOutput('version', version);
            console.log(`Next version: v${version}`);

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-13
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish Editor/Editor.csproj -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true --self-contained true -p:UseAppHost=true -p:Version=${{ needs.prepare.outputs.version }} -o publish/${{ matrix.rid }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath RSIEdit-${{ matrix.rid }}.zip

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: zip -r RSIEdit-${{ matrix.rid }}.zip publish/${{ matrix.rid }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSIEdit-${{ matrix.rid }}
          path: RSIEdit-${{ matrix.rid }}.zip

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: RSIEdit v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: |
            RSIEdit-win-x64/RSIEdit-win-x64.zip
            RSIEdit-linux-x64/RSIEdit-linux-x64.zip
            RSIEdit-osx-x64/RSIEdit-osx-x64.zip
